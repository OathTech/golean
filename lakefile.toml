name = "GoLean"
version = "0.1.0"
defaultTargets = ["golean"]

[[lean_lib]]
name = "GoLean"

[[lean_exe]]
name = "golean"
root = "Main"

[[lean_lib]]
# Generated oracle-vector data modules (tools/floatvectors); a lib so the
# eval-test exe's import resolves to a buildable target.
name = "TestsData"
globs = ["Tests.FloatVectors"]

[[lean_exe]]
name = "gocore-eval-tests"
root = "Tests.GoCoreEval"

[[lean_lib]]
# Every Tests module has library ownership, including the eval executable root.
name = "EvalTests"
globs = ["Tests.GoCoreEval"]

[[lean_lib]]
# Iris-free contract regressions and their post-import dependency audit.
name = "InterfaceTests"
globs = ["Tests.InterfaceContract", "Tests.BooleanRuntime", "Tests.BooleanProgram", "Tests.InterfaceAudit", "Tests.PanicRendering", "Tests.StringPanicMembers"]

[[lean_lib]]
name = "AdmissionTests"
globs = ["Tests.GoCoreAdmissionFixture", "Tests.GoCoreAdmission", "Tests.GoCoreAdmissionAudit"]

[[lean_lib]]
# Separate I1 declaration schema; no production lowering or Iris dependency.
name = "DeclarationTests"
globs = ["Tests.DeclarationWire", "Tests.StrictJsonParse", "Tests.DeclarationUnicode", "Tests.DeclarationAudit"]

[[lean_lib]]
name = "BooleanTypingTests"
globs = ["Tests.BooleanTyping", "Tests.BooleanTypingFixture", "Tests.BooleanTypingAudit"]

[[lean_lib]]
name = "BooleanRuntimeTests"
globs = ["Tests.BooleanInvariant", "Tests.BooleanSafetyAudit"]

[[lean_lib]]
name = "RecoveryTypingTests"
globs = ["Tests.RecoveryTyping", "Tests.RecoveryTypingFixture", "Tests.RecoveryA2Artifact", "Tests.RecoveryDiagnosticControls", "Tests.RecoveryTypingAudit"]

[[lean_lib]]
name = "RecoveryStorageTests"
globs = ["Tests.RecoveryStorage", "Tests.RecoveryStorageAudit"]

[[lean_lib]]
name = "RecoverySetupTests"
globs = ["Tests.RecoverySetup", "Tests.RecoverySetupAudit"]

[[lean_lib]]
name = "RecoveryControlTests"
globs = ["Tests.RecoveryInvariant", "Tests.RecoveryControlAudit"]

[[lean_lib]]
name = "AbortObservationTests"
globs = ["Tests.AbortObservation", "Tests.AbortObservationAudit"]

[[lean_lib]]
# The recovery profile's terminal classification over the repanicCollapse
# tape and the D5 refusal (landing chunk L3), with its post-import audit.
name = "RecoveryTerminalTests"
globs = ["Tests.RecoveryTerminal", "Tests.RecoveryTerminalAudit"]
