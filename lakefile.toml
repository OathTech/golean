name = "GoLean"
version = "0.1.0"
# The default targets are the LIBRARIES THAT DEFINE NO TOP-LEVEL `main` — the
# proof and pin holders ([USER] 2026-10-21, release-readiness row 42's open
# half, paraphrased: `lake check` exports every default target's modules into
# ONE environment and stops at the second `main`; the defaults become the
# libraries only, and the gate builds every other target by name). This
# narrows the 2026-10-12 «every library and executable is a default target»
# arrangement (docs/2026-10-12_gate-cull-plan.md §3.2, D2) for the default
# SET only: scripts/ci still builds every declared target, each named on its
# `lake build` line, and still checks that every Tests/*.lean is in a glob.
# Built by name, NOT default ([AGENT] 2026-10-21, each from its built .ilean):
# the executables `golean` (Main) and `gocore-eval-tests` (Tests.GoCoreEval),
# and the libraries whose modules define `main` for `lean --run` — EvalTests
# (Tests.GoCoreEval), DeclarationTests (Tests.StrictJsonParse),
# MethodIdentityTests (Tests.MethodIdentity), UnseqSchedulerTests
# (Tests.UnseqScheduler), UnseqWireTests (Tests.UnseqWire), EquationTests
# (Tests.EquationClient: its 310 pin theorems sit under that `main`, so they
# are outside `lake check`; scripts/check-equations builds and runs them).
# scripts/ci checks this split both ways from the built .ilean files: a
# main-free library that is not default FAILS, a default executable or
# main-bearing library FAILS.
defaultTargets = ["GoLean", "TestsData", "AdmissionTests", "GoCoreAuditTests"]

[[lean_lib]]
name = "GoLean"

[[lean_exe]]
name = "golean"
root = "Main"

[[lean_lib]]
# Generated oracle-vector data modules (tools/floatvectors); a lib so the
# eval-test exe's import resolves to a buildable target.
name = "TestsData"
globs = ["Tests.FloatVectors"]

[[lean_exe]]
name = "gocore-eval-tests"
root = "Tests.GoCoreEval"

[[lean_lib]]
# Every Tests module has library ownership, including the eval executable root.
name = "EvalTests"
globs = ["Tests.GoCoreEval"]

[[lean_lib]]
name = "AdmissionTests"
globs = ["Tests.GoCoreAdmissionFixture", "Tests.GoCoreAdmission"]

[[lean_lib]]
# Separate I1 declaration schema; no production lowering or Iris dependency.
name = "DeclarationTests"
globs = ["Tests.DeclarationWire", "Tests.StrictJsonParse", "Tests.DeclarationUnicode"]

[[lean_lib]]
# Shared I1/executable member identity and decoder.
name = "MethodIdentityTests"
globs = ["Tests.MethodIdentity"]

[[lean_lib]]
# The `unseq` scheduler on hand-built graphs (evaluation-order model v2.1
# Stage B): the reference sets over all tapes, refusals by name, replay.
# (The theorems' axiom audit is the core totality audit's, over every GoLean/ module.)
name = "UnseqSchedulerTests"
globs = ["Tests.UnseqHarness", "Tests.UnseqScheduler"]

[[lean_lib]]
# Stage C of the evaluation-order model v2.1: hand-built `unseq` WIRES through the
# strict byte parser, the decoder (GoLean/NativeToIR.lean's `unseq` arm) and the
# same enumerator — check (b) «machine equals reference over the wire»; the
# decoder's named refusals on one-edit mutants.
name = "UnseqWireTests"
globs = ["Tests.UnseqWire"]

[[lean_lib]]
# The core totality audit and the core contract regressions, re-homed from the
# parked typed-profile family (docs/2026-09-16_typed-profiles-parked.md §3):
# recover/choice-site/trace facts, interpreter facts, and the post-import axiom
# audit over EVERY module under GoLean/ (classical trio only), with the
# panic-text renderer tests. (The string-panic member tests left with the
# relational layer, 2026-10-20.)
name = "GoCoreAuditTests"
globs = ["Tests.GoCoreContract", "Tests.PanicRendering", "Tests.GoCoreAudit"]

[[lean_lib]]
# The comparator CHALLENGE (release-readiness row 43, [USER] 2026-10-23): the kept customer
# surface frozen as statements with `sorry` holes, judged against the generated Solution
# (GoLean/Contract/Solution.lean, in the GoLean library) by `lake comparator` (comparator.json
# at the root; scripts/check-comparator in the --diff tier). NOT a default target and imported
# by nothing, by design: its holes would fail `lake check`'s axiom verdict and its names are the
# Solution's. scripts/ci's target-split check reads this exemption from comparator.json.
name = "ContractChallenge"
globs = ["Contract.Challenge"]

[[lean_lib]]
# The toy semantic-equation CLIENT (window packet D, 2026-10-03; charter row 7, decision 8): GoCore
# only, symbolic state and continuations, proves its facts by the `stepFn_eqns` rewrite set and
# pins every equation theorem (exhaustive enrollment); run by scripts/check-equations. No runtime
# module imports it.
name = "EquationTests"
globs = ["Tests.EquationClient"]
