name = "golean-proofs"
defaultTargets = ["GoLeanProofs", "Audit"]

# The Iris proof layer, kept a SEPARATE Lake package inside the golean repo so
# `lake build` at the repo root never depends on or fetches iris-lean; only
# building THIS package pulls it. golean's own lakefile stays dependency-free.
#
# iris-lean is a pinned git dependency (not an external path) so the repo is
# self-contained: clone golean + `lake build` here fetches everything. The rev
# is the U0 boundary rev (docs/2026-08-28_u0-refresh-log.md; [USER]-approved
# at gate N-2, 2026-08-28 — upstream master head 2026-08-19, probed green on
# Lean v4.32.2); it targets Lean 4.32.2. Previous pin: 3877dbec… (spike-
# validated, docs/2026-07-18_iris-spike-result.md, Lean 4.31.0).

[[require]]
name = "GoLean"
path = ".."

[[require]]
name = "iris"
git = "https://github.com/leanprover-community/iris-lean.git"
rev = "e7a0a43814c4f1154ca0c8049883ca56c2288b86"
subDir = "Iris"

[[lean_lib]]
name = "GoLeanProofs"

# In-build epistemic gate: axiom-allowlist (#guard_msgs #print axioms) + non-vacuity
# witness references. A weakening of the proof layer's claims fails THIS build.
[[lean_lib]]
name = "Audit"

# The validation-corpus targets (GoLeanProofsCorpus/AuditCorpus) were
# DELETED at the W0 reset (2026-08-27, kill-list K-D): the literal-mode
# corpus they aggregated is archived at archive/fixed-trajectory-era
# (docs/ARCHIVE.md); scripts/ci's coverage step is back to the single
# default closure + allowlist.

# The verified fast replay driver (campaign Arc 2, unit P2R): compiled
# `stepFast` execution of a wire program with the pinned transfer theorem
# (`FastEval/Transfer.lean`) carrying the verdict to `runProgramM`. NOT a
# default target — built on demand (`lake build fastreplay`); its module
# is in the GoLeanProofs aggregator, so the proofs gate still checks it.
[[lean_exe]]
name = "fastreplay"
root = "GoLeanProofs.FastReplay"

# The Comparator judge pair (comparator-judge sprint, 2026-08-02; invoked by
# scripts/comparator-judge, config in judge-config.json — NOT default
# targets, so `lake build` here never touches them):
#   Challenge — TRUSTED: sorry-bodied restatements of the designated headline
#     theorems; its module imports are restricted to the measured Iris-free
#     chain (scripts/ci surface purity). A judge run's trust boundary is
#     exactly Challenge.lean's import closure plus this lakefile.
#   Solution — untrusted by the judge: the same statements proven by
#     reference to GoLeanProofs; Comparator re-elaborates, exports, and
#     kernel-replays it sandboxed, enforcing statement identity and the
#     axiom allowlist.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
