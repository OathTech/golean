name: gate

# The non-bypassable backstop for scripts/ci (the one-command validation gate:
# escape-hatch preflight, bug-index + feature-coverage cross-checks, core build,
# proofs build incl. the in-build Audit axiom/non-vacuity sweep, eval tests,
# baseline diff + re-pin guard). Push/PR runs the fast gate; the full
# differential corpus (`go run` per case) runs nightly and on manual dispatch.
# The NIGHTLY runs `--slow` (tiered checking, 2026-08-08): tier=slow rows are
# fully RE-CERTIFIED against their tracked certified-set records — this is the
# scheduled cadence the membership-lane design note names. Manual dispatch
# defaults to the same `--slow`; pass slow=false for a quick `--diff` run
# (recorded decision: the dispatch path is usually a "run the full thing now"
# request, so it defaults to the strongest form).
# Local runs of scripts/ci give the same answer — CI is redundancy, not a
# different check.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "Re-certify tier=slow rows (scripts/ci --slow); false = quick --diff"
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * *' # nightly full differential incl. --slow re-certification

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # the re-pin guard audits the tip commit vs HEAD~1

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache toolchains and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
            proofs/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'proofs/lean-toolchain', 'proofs/lake-manifest.json') }}
          restore-keys: lake-${{ runner.os }}-

      # The imported-goose guards (ci steps 1c3-1c5) verify landed corpus
      # bytes and R2 pin terms against the PINNED goose checkout and fail
      # CLOSED if it is absent — deps/ is gitignored, so the runner must
      # clone it (pre-merge audit round, 2026-08-08; rev = the pin in
      # scripts/import-goose and scripts/check-imported-goose).
      - name: Reference checkout deps/goose at the pinned rev
        run: |
          git clone --quiet https://github.com/goose-lang/goose deps/goose
          git -C deps/goose checkout --quiet 3be88bbb4982f58e5813b6f0344302d5582c8e8a

      - name: Fast gate (scripts/ci)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: ./scripts/ci

      - name: Set up Go (full differential)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          # No module cache to manage: the repo has no go.mod/go.sum (the
          # differential harness runs GO111MODULE=off with a repo-local
          # GOCACHE), so the default cache:true only emits a go.sum warning.
          cache: false

      - name: Full gate incl. differential corpus (scheduled/dispatch; --slow re-certifies tier=slow rows)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.slow }}" != "false" ]; then
            ./scripts/ci --slow
          else
            ./scripts/ci --diff
          fi
