name: gate

# The non-bypassable backstop for scripts/ci (the one-command validation gate:
# escape-hatch preflight, bug-index + feature-coverage cross-checks, core build,
# eval tests, baseline diff + re-pin guard; the proofs-side steps left with
# the proofs package at the repo split, 2026-08-31 — branch
# park/reasoning-2026-08-31). Push/PR runs the fast gate; the full
# differential corpus (`go run` per case) runs nightly and on manual dispatch.
# The NIGHTLY runs `--slow` (tiered checking, 2026-08-08): tier=slow rows are
# fully RE-CERTIFIED against their tracked certified-set records — this is the
# scheduled cadence the membership-lane design note names. Manual dispatch
# defaults to the same `--slow`; pass slow=false for a quick `--diff` run
# (recorded decision: the dispatch path is usually a "run the full thing now"
# request, so it defaults to the strongest form).
# Local runs of scripts/ci give the same answer — CI is redundancy, not a
# different check.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "Re-certify tier=slow rows (scripts/ci --slow); false = quick --diff"
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * *' # nightly full differential incl. --slow re-certification

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # the re-pin guard audits the tip commit vs HEAD~1

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Machine-shape baseline, before the cache restore does the run's
      # heaviest I/O. Honest scope (audit F7, 2026-08-15): a VM that DIES
      # uploads nothing, this included — the value is a baseline for runs
      # that survive (which the gate-step cap makes likelier), and the
      # numbers the cap arithmetic below depends on.
      - name: Runner diagnostics (machine-shape baseline)
        run: |
          nproc; free -h; df -h /; swapon --show || true

      # OLEAN CACHING (examples phase-2 slice 0, lever 5, 2026-08-14).
      # The key has THREE layers, and the third one is the fix: keyed on
      # toolchain + manifest ALONE, every proofs commit hit the same key
      # exactly, and actions/cache does not SAVE on an exact hit — so the
      # entry froze at whatever the first save contained and every later
      # run re-elaborated everything that had changed since, forever.
      # Adding a source-tree hash makes each distinct source state save
      # its own entry; the layered restore-keys then fall back to the
      # newest entry sharing the toolchain+manifest prefix, which is the
      # incremental-reuse case (Lake re-elaborates exactly the modules
      # whose hashes moved).
      #
      # Cost, recorded honestly: a fresh entry per source state churns
      # the repo's 10 GB cache budget, so
      # GitHub evicts LRU and only the last few states stay warm. That is
      # the intended trade — a warm recent state beats a frozen old one.
      # HIT RATE IS NOT MEASURED HERE: it can only be observed on a real
      # runner, over at least two pushes (first saves, second restores).
      # SPLIT RESTORE/SAVE (2026-08-14): plain actions/cache@v4 only saves
      # in its post-step when the JOB SUCCEEDED — attempt 2 of the 4f29a44f
      # run proved it (gate TERMed by a runner shutdown -> job failed ->
      # "Post Cache" skipped -> nothing saved), which is why a failing
      # state never converges across retries: every retry restores the
      # same old entry and re-elaborates the same modules. The explicit
      # save step at the END of the job runs `if: always()`, so a
      # failed-but-alive job still banks its build progress. (A runner
      # that DIES outright saves nothing — no step outlives the VM; the
      # cap + diagnostics below are that half of the mitigation.)
      - name: Restore toolchains and build artifacts
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            .lake
          # The -r<run>.<attempt> suffix (audit F3, 2026-08-15) makes every
          # SAVED key unique: with a plain source-hash key, a retry of the
          # same commit exact-hits the failed attempt's entry and the
          # cache-hit guard then skips the save — so convergence stopped
          # after ONE generation (the same frozen-entry pathology as above,
          # one step later). With unique keys the primary never exact-hits;
          # the FIRST restore-keys layer (source-hash prefix) restores the
          # newest attempt of the same source state, so each retry resumes
          # where the previous one died. Churn cost: same trade as already
          # recorded above, extended to re-runs; LRU eviction absorbs it.
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('GoLean/**/*.lean', 'Tests/**/*.lean') }}-r${{ github.run_id }}.${{ github.run_attempt }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('GoLean/**/*.lean', 'Tests/**/*.lean') }}-
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-

      # The imported-goose verbatim guard verifies landed corpus
      # bytes against the PINNED goose checkout and fails
      # CLOSED if it is absent — deps/ is gitignored, so the runner must
      # clone it (pre-merge audit round, 2026-08-08; rev = the pin in
      # scripts/import-goose and scripts/check-imported-goose).
      - name: Reference checkout deps/goose at the pinned rev
        run: |
          git clone --quiet https://github.com/goose-lang/goose deps/goose
          git -C deps/goose checkout --quiet 3be88bbb4982f58e5813b6f0344302d5582c8e8a

      # RUNNER-SIDE MEMORY CAP (2026-08-14, audit-hardened 08-15;
      # supersedes the bare =none opt-out of 2026-08-09). Honest scope
      # first: the observed 4f29a44f deaths were PLATFORM-SIDE VM
      # shutdowns ("The runner has received a shutdown signal", two Azure
      # regions) — no workflow content prevents those, and the
      # investigation refuted memory/disk/workload as causes. What the
      # scope buys is the failure mode we CAN own: a future memory blowout
      # of ours dies as a red BUILD (logs uploaded, progress banked by the
      # always() save step below) instead of a dead VM with zero logs —
      # scripts/capped's blast-radius philosophy, one level up. A hosted
      # runner has no systemd USER bus (why scripts/capped itself cannot
      # wrap here — pre-merge audit F1, 2026-08-09) but it does have
      # passwordless sudo and a SYSTEM manager, so each gate step runs in
      # a system cgroup scope. THE CAP IS PROVEN, NOT ASSERTED (audit F2,
      # 2026-08-15): GOLEAN_CAPPED=1 + a real GOLEAN_MEM_MAX route
      # scripts/ci through scripts/capped's untrusted-token readback,
      # which checks the kernel's memory.max INSIDE the scope and refuses
      # (exit 3) if systemd accepted-and-ignored the property — the exact
      # fail-open capped was written against. Passing the real size also
      # feeds ci's cap-scaled LEAN_NUM_THREADS heuristic (audit F6: =none
      # made the gate print "no cap" under a live 5.7G ceiling, and on a
      # bigger runner would have let the toolchain default overshoot it).
      # Cost, recorded (audit F1): MemorySwapMax=0 forbids the swap the
      # old uncapped runs could thrash into, and the cold 2-thread runner
      # peak has never been measured — if a legitimate gate peak ever
      # exceeds RAM-1.2G, the run goes red at the cgroup (legible in the
      # OOM-discriminator step below); the remedy is revisiting the
      # constant with the diagnostics numbers, never deleting the
      # readback. Investigation record:
      # docs/2026-08-14_ci-runner-death-and-slow-tier-timeout.md.

      # check-spec-anchors (spec-truth P2) verifies spec#/mem# citations
      # against the PINNED golang/go checkout and fails CLOSED if absent
      # or off-pin. Shallow single-branch clone at the tag = the pinned
      # commit (scripts/setup-deps 'go' row; docs/spec-sources.md).
      - name: Reference checkout deps/go at the pinned tag
        run: |
          git clone --quiet --depth 1 --branch go1.26.5 https://github.com/golang/go deps/go

      - name: Set up Go (pinned to the oracle family)
        uses: actions/setup-go@v5
        with:
          # The differential oracle IS go1.26.5 EXACTLY (docs/spec-sources.md
          # — the doctrine pin): every fatal-message, panic-payload, and probe
          # claim is measured against it, and patch releases differ observably
          # (go1.26.6 ships 7 compiler changes; L-014's miscompile class).
          # HISTORY: '1.26.x' (2026-08-11) fixed a pre-1.26 family float but
          # still floated WITHIN the family — go1.26.6's release moved the
          # oracle under CI silently (2026-08-21, the worker-pool/sum CI
          # failure's suspect). A pin that names a family is still a float.
          # Bump ONLY together with a re-validated oracle (probes + baseline
          # re-pin rationale + the deps/go clone tag above, in one change).
          go-version: '1.26.5'
          cache: false

      - name: Fast gate (scripts/ci)
        id: fast-gate
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        # GOLEAN_ALLOW_NO_DIFF: a fresh runner has no artifacts/
        # (gitignored), so it has no recorded differential or negative
        # run — legitimately, since this step is the FAST gate and never
        # produces one. Absent records are a FAIL rather than a silent
        # skip (audit F4), so this environment says so explicitly instead
        # of being exempted in the script. The scheduled --diff/--slow
        # step below produces its own records and must NOT set this.
        # (env is passed inside the wrapper: sudo resets the environment.
        # runuser is load-bearing: it restores HOME=/home/runner for
        # ~/.elan and keeps git's safe.directory ownership check happy.
        # The in-scope echo is the drop detector for anything else the
        # allowlist misses — audit F8.)
        run: |
          total_mb=$(free -m | awk '/^Mem:/{print $2}')
          if [ "${total_mb:-0}" -le 2000 ]; then
            echo "free -m reported total '${total_mb:-}' MiB — refusing to derive a memory cap from it" >&2
            exit 1
          fi
          cap_mb=$(( total_mb - 1200 ))
          sudo -n systemd-run --scope -p "MemoryMax=${cap_mb}M" -p MemorySwapMax=0 \
            runuser -u "$(id -un)" -- env "PATH=$PATH" \
              GOLEAN_CAPPED=1 "GOLEAN_MEM_MAX=${cap_mb}M" GOLEAN_ALLOW_NO_DIFF=1 \
              bash -c 'echo "in-scope: user=$(id -un) pwd=$PWD | $(go version 2>&1) | $(lake --version 2>&1)"; exec ./scripts/ci'

      # (Go setup moved above the fast gate and pinned — both gates use it;
      # the old conditional stable-floating step let the fast gate run on
      # the runner image's Go. No module cache: the repo has no go.mod.)

      - name: Full gate incl. differential corpus (scheduled/dispatch; --slow re-certifies tier=slow rows)
        id: full-gate
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # Same proven runner-side cgroup cap as the fast gate (rationale
        # above; keep the two wrappers in lockstep).
        run: |
          total_mb=$(free -m | awk '/^Mem:/{print $2}')
          if [ "${total_mb:-0}" -le 2000 ]; then
            echo "free -m reported total '${total_mb:-}' MiB — refusing to derive a memory cap from it" >&2
            exit 1
          fi
          cap_mb=$(( total_mb - 1200 ))
          cap() {
            sudo -n systemd-run --scope -p "MemoryMax=${cap_mb}M" -p MemorySwapMax=0 \
              runuser -u "$(id -un)" -- env "PATH=$PATH" \
                GOLEAN_CAPPED=1 "GOLEAN_MEM_MAX=${cap_mb}M" \
                bash -c 'echo "in-scope: user=$(id -un) pwd=$PWD | $(go version 2>&1) | $(lake --version 2>&1)"; exec ./scripts/ci "$@"' ci-wrapper "$@"
          }
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.slow }}" != "false" ]; then
            cap --slow
          else
            cap --diff
          fi

      # Was anything OOM-killed inside the gate's cgroup scope? A cap kill
      # would otherwise be indistinguishable from a semantic failure in
      # the differential (a killed worker surfaces as a case FAIL — audit
      # F1b/F7): the kernel ring buffer is the cheap discriminator.
      - name: OOM discriminator (forensics)
        if: always()
        # The || belongs on a CAPTURED result, not the pipeline: tail
        # exits 0 on empty input, so the fallback line never fired on the
        # first live run (2026-08-15) even though there were no events.
        run: |
          oom="$(sudo -n dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -20)"
          if [ -n "$oom" ]; then printf '%s\n' "$oom"; else echo "dmesg: no OOM events"; fi

      # The save half of the split cache — see the restore step's comment.
      # `always()` is the point: a red gate still saves, so each retry
      # resumes from the previous attempt's build progress (per-attempt
      # unique keys make this converge past one generation — audit F3).
      # The skipped-gate guard (audit F4): if neither gate step ran (an
      # early setup failure), there is no build progress — saving would
      # bank a thin ~/.elan-only entry as the newest source-prefix match
      # and poison later restores. Paths mirror the restore step exactly;
      # keep them in lockstep.
      - name: Save toolchains and build artifacts (runs even on a red gate)
        if: always() && (steps.fast-gate.conclusion != 'skipped' || steps.full-gate.conclusion != 'skipped')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            .lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
