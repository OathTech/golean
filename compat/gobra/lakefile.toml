name = "GobraCompat"
version = "0.1.0"
defaultTargets = ["GobraCompat", "AxCheck"]

# Spike package: depends on the proofs layer (which transitively brings the
# GoLean root package and iris-lean) but is referenced by NOTHING in the
# main build — same isolation contract as compat/verdi.
[[require]]
name = "golean-proofs"
path = "../../proofs"

[[lean_lib]]
name = "GobraCompat"
[[lean_lib]]
name = "AxCheck"
globs = ["AxCheck"]
