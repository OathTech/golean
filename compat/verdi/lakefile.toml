name = "VerdiCompat"
version = "0.1.0"
defaultTargets = ["VerdiCompat", "AxCheck", "diffharness"]

[[lean_lib]]
name = "VerdiCompat"

# The axiom audit runs as part of the build (audit-finding F3: an
# unwired check is decorative). ENFORCING since the 2026-08-10 merge
# window (this comment corrected 2026-08-22, campaign unit 5 — the old
# text still said "advisory"): AxCheck.lean carries curated
# `#guard_msgs in #print axioms` pins per headline theorem AND an
# exhaustive collectAxioms sweep that `throwError`s on anything beyond
# the lane's recorded set {propext, Quot.sound}.
[[lean_lib]]
name = "AxCheck"
globs = ["AxCheck"]

# The differential harness's Lean leg (design note §3 path 2). The Rocq
# oracle leg lives in extraction/ (attached 2026-08-10, lane log
# docs/2026-08-09_verdi-p1-lane.md) and never enters this build.
# Run: .lake/build/bin/diffharness check fixtures/handlers-n3.tsv
[[lean_exe]]
name = "diffharness"
root = "DiffHarness"
